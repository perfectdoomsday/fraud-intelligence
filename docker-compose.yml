name: fraud-intelligence

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fraud_intelligence
      POSTGRES_USER: fraud_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-only-change-me}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_app -d fraud_intelligence"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 6
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: ["kafka_data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://fraud_app:${POSTGRES_PASSWORD:-local-postgres-only-change-me}@postgres:5432/fraud_intelligence
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ENABLED: "true"
      MODEL_ARTIFACT_PATH: /app/artifacts/demo_fraud_model.joblib
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-CHANGE_THIS_LOCAL_SECRET_BEFORE_DEPLOYMENT}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@local.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe-Local-Only-123!}
      CORS_ORIGINS: http://localhost:5173,http://localhost:8088,http://localhost:3000
    ports: ["8000:8000"]
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports: ["8088:80"]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

  # Optional browser-based Kafka topic inspection.
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    profiles: ["tools"]
    ports: ["8090:8080"]
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on: [kafka]

  # Optional MLflow registry/tracking UI; training scripts run locally or in a worker.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    profiles: ["mlops"]
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "sqlite:///mlflow/mlflow.db", "--default-artifact-root", "/mlartifacts"]
    ports: ["5000:5000"]
    volumes: ["mlflow_data:/mlflow", "mlflow_artifacts:/mlartifacts"]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["mlops"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-local-minio-user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-password-change-me}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]

  prometheus:
    image: prom/prometheus:v3.3.0
    profiles: ["observability"]
    ports: ["9090:9090"]
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on: [backend]

  grafana:
    image: grafana/grafana:11.6.0
    profiles: ["observability"]
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-grafana-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]

  # Optional orchestration environment. The DAG is a template requiring ML extras and input data.
  airflow:
    image: apache/airflow:2.10.5-python3.11
    profiles: ["orchestration"]
    command: standalone
    ports: ["8080:8080"]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    volumes:
      - ./orchestration/airflow/dags:/opt/airflow/dags
      - ./:/opt/airflow/project:ro
      - ./data:/opt/airflow/data:ro
      - ./artifacts:/opt/airflow/artifacts
      - airflow_data:/opt/airflow

  spark-master:
    image: apache/spark:3.5.5
    profiles: ["analytics"]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports: ["7077:7077", "8081:8080"]

  spark-worker:
    image: apache/spark:3.5.5
    profiles: ["analytics"]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on: [spark-master]

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  mlflow_data:
  mlflow_artifacts:
  minio_data:
  prometheus_data:
  grafana_data:
  airflow_data:
